<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathType - Interactive Equation Editor</title>

  <!-- Office JavaScript API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <!-- MathLive Interactive Equation Library -->
  <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>

  <style>
    :root {
      --primary: #185abd;
      --primary-hover: #11499c;
      --primary-active: #0c3875;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --border: #d2d0ce;
      --border-focus: #185abd;
      --text: #242424;
      --text-muted: #616161;
      --danger: #a80000;
      --danger-bg: #fde7e9;
      --radius: 6px;
      --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group svg {
      width: 22px;
      height: 22px;
      fill: var(--primary);
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mode-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #e1dfdd;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Clear Button in header */
    .btn-clear {
      font-size: 12px;
      font-family: inherit;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--danger);
      border-radius: 4px;
      padding: 0 10px;
      height: 28px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .btn-clear:hover {
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    /* Ribbon Tabs */
    .ribbon-tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f3f2f1;
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      user-select: none;
    }

    .tab-buttons {
      display: flex;
      gap: 2px;
    }

    .tab-btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--primary);
      background: rgba(24, 90, 189, 0.04);
    }

    .tab-btn.active {
      color: var(--primary);
      font-weight: 600;
      border-bottom-color: var(--primary);
      background: #ffffff;
    }

    /* Virtual Keyboard Toggle in Tab Bar */
    .tab-action-btn {
      font-size: 12px;
      font-family: inherit;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 3px 10px;
      height: 26px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .tab-action-btn:hover {
      background: #eef4fc;
      color: var(--primary);
      border-color: var(--primary);
    }

    /* Ribbon Toolbar Panels */
    .ribbon-panel {
      display: none;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      min-height: 48px;
    }

    .ribbon-panel.active {
      display: flex;
    }

    .tool-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: 'Cambria Math', 'KaTeX_Main', serif;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s ease;
      min-width: 32px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tool-btn:hover {
      background: #eef4fc;
      border-color: var(--primary);
      color: var(--primary);
    }

    .tool-btn-labeled {
      font-family: var(--font);
      font-size: 12px;
      padding: 4px 10px;
      gap: 5px;
    }

    .tool-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 4px;
    }

    .panel-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 4px;
    }

    /* Color Swatches */
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.15);
      border-color: #000000;
    }

    /* Editor Body */
    main {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .editor-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    /* MathLive Field */
    math-field {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 24px;
      min-height: 120px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
      outline: none;
      transition: border-color 0.15s;
    }

    /* Completely hide MathLive's native menu toggle (hamburger) icon */
    math-field::part(menu-toggle) {
      display: none !important;
    }

    math-field:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 1px var(--border-focus);
    }

    /* Empty matrix cells dashed outline */
    math-field::part(content) .ML__cell:empty,
    math-field::part(content) td:empty {
      min-width: 1.2em;
      min-height: 1.2em;
      display: inline-block;
      border: 1px dashed rgba(0, 0, 0, 0.35);
      border-radius: 2px;
      vertical-align: middle;
      margin: 2px;
    }

    /* Status & Error notice inside dialog */
    .dialog-notice {
      display: none;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #f5c6cb;
    }

    /* Raw LaTeX display */
    .latex-preview-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 12px;
    }

    .latex-code {
      font-family: 'Consolas', 'Courier New', monospace;
      color: #004e8c;
      word-break: break-all;
      margin-top: 4px;
      user-select: all;
    }

    /* Footer with Actions */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    button.btn {
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #f3f2f1;
    }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      background: #c8c6c4;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="title-group">
      <svg viewBox="0 0 24 24">
        <path d="M18 4H6v2l6 6-6 6v2h12v-3h-7.5l4.5-4.5-4.5-4.5H18V4z"/>
      </svg>
      <h1>MathType Equation Editor</h1>
    </div>

    <div class="header-controls">
      <span id="editorModeTag" class="mode-tag">New Equation</span>
      <button id="btnClear" class="btn-clear" title="Clear current equation">Clear</button>
    </div>
  </header>

  <!-- Upper Tab Navigation Bar with Virtual Keyboard Button -->
  <nav class="ribbon-tabs">
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="tab-insert">Insert</button>
      <button class="tab-btn" data-tab="tab-matrix">Matrix</button>
      <button class="tab-btn" data-tab="tab-style">Font &amp; Style</button>
      <button class="tab-btn" data-tab="tab-color">Colors</button>
      <button class="tab-btn" data-tab="tab-edit">Edit</button>
    </div>

    <!-- Virtual Keyboard Toggle Button -->
    <button id="btnToggleKeyboard" class="tab-action-btn" title="Toggle On-Screen Virtual Keyboard">
      ⌨ Virtual Keyboard
    </button>
  </nav>

  <!-- 1. Insert Panel -->
  <div id="tab-insert" class="ribbon-panel active">
    <button class="tool-btn" data-cmd="insert" data-arg="\frac{#?}{#?}" title="Fraction: a/b">a/b</button>
    <button class="tool-btn" data-cmd="insert" data-arg="#?^{#?}" title="Power: x^y">xʸ</button>
    <button class="tool-btn" data-cmd="insert" data-arg="#?_{#?}" title="Subscript: x_y">xᵧ</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\sqrt{#?}" title="Square Root: √x">√x</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\sqrt[#?]{#?}" title="N-th Root: ⁿ√x">ⁿ√x</button>
    
    <div class="tool-divider"></div>

    <button class="tool-btn" data-cmd="insert" data-arg="\left( #? \right)" title="Parentheses: ( )">(·)</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\left[ #? \right]" title="Brackets: [ ]">[·]</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\left\{ #? \right\}" title="Braces: { }">{·}</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\left| #? \right|" title="Absolute value: | |">|·|</button>

    <div class="tool-divider"></div>

    <button class="tool-btn" data-cmd="insert" data-arg="\int_{#?}^{#?} #? \,d#?" title="Definite Integral">∫</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\sum_{#?}^{#?} #?" title="Summation">∑</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\prod_{#?}^{#?} #?" title="Product">∏</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\lim_{#? \to #?} #?" title="Limit">lim</button>

    <div class="tool-divider"></div>

    <button class="tool-btn" data-cmd="insert" data-arg="\pm" title="Plus-Minus: ±">±</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\times" title="Multiplication: ×">×</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\div" title="Division: ÷">÷</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\neq" title="Not Equal: ≠">≠</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\leq" title="Less than or equal: ≤">≤</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\geq" title="Greater than or equal: ≥">≥</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\approx" title="Approximately: ≈">≈</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\infty" title="Infinity: ∞">∞</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\pi" title="Pi: π">π</button>
    <button class="tool-btn" data-cmd="insert" data-arg="\theta" title="Theta: θ">θ</button>
  </div>

  <!-- 2. Matrix Panel -->
  <div id="tab-matrix" class="ribbon-panel">
    <span class="panel-label">Presets:</span>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\begin{pmatrix} #? & #? \\ #? & #? \end{pmatrix}" title="2x2 Matrix">2×2 ( )</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\begin{pmatrix} #? & #? & #? \\ #? & #? & #? \\ #? & #? & #? \end{pmatrix}" title="3x3 Matrix">3×3 ( )</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\begin{bmatrix} #? & #? \\ #? & #? \end{bmatrix}" title="Bracket Matrix [M]">2×2 [ ]</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\begin{vmatrix} #? & #? \\ #? & #? \end{vmatrix}" title="Determinant |M|">2×2 | |</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\begin{pmatrix} #? & #? \end{pmatrix}" title="Row Vector">1×2 Row</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\begin{pmatrix} #? \\ #? \end{pmatrix}" title="Column Vector">2×1 Col</button>

    <div class="tool-divider"></div>

    <span class="panel-label">Modify Matrix:</span>
    <button class="tool-btn tool-btn-labeled" data-matrix-action="addColumnAfter" title="Add Column Right with Placeholder">+ Col</button>
    <button class="tool-btn tool-btn-labeled" data-matrix-action="addRowAfter" title="Add Row Below with Placeholder">+ Row</button>
    <button class="tool-btn tool-btn-labeled" data-matrix-action="removeColumn" title="Delete Current Column">− Col</button>
    <button class="tool-btn tool-btn-labeled" data-matrix-action="removeRow" title="Delete Current Row">− Row</button>
  </div>

  <!-- 3. Font & Style Panel -->
  <div id="tab-style" class="ribbon-panel">
    <span class="panel-label">Font Styles:</span>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\mathbf{#?}" title="Bold: \mathbf{x}"><b>Bold</b></button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\mathit{#?}" title="Italic: \mathit{x}"><i>Italic</i></button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\mathrm{#?}" title="Roman (Regular): \mathrm{x}">Roman</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\mathbb{#?}" title="Blackboard Bold: \mathbb{R}">Double-Struck ℝ</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\mathcal{#?}" title="Calligraphic: \mathcal{L}">Script ℒ</button>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\mathfrak{#?}" title="Fraktur: \mathfrak{X}">Fraktur 𝔛</button>

    <div class="tool-divider"></div>

    <span class="panel-label">Mode:</span>
    <button class="tool-btn tool-btn-labeled" data-cmd="insert" data-arg="\text{#?}" title="Plain Text in Equation">"Text Mode"</button>
  </div>

  <!-- 4. Colors Panel -->
  <div id="tab-color" class="ribbon-panel">
    <span class="panel-label">Text Color:</span>
    <button class="color-swatch" data-color="#000000" style="background: #000000;" title="Default Black"></button>
    <button class="color-swatch" data-color="#185abd" style="background: #185abd;" title="Blue"></button>
    <button class="color-swatch" data-color="#d83b01" style="background: #d83b01;" title="Red"></button>
    <button class="color-swatch" data-color="#107c10" style="background: #107c10;" title="Green"></button>
    <button class="color-swatch" data-color="#5c2d91" style="background: #5c2d91;" title="Purple"></button>
    <button class="color-swatch" data-color="#d13438" style="background: #d13438;" title="Crimson"></button>

    <div class="tool-divider"></div>

    <span class="panel-label">Background Highlight:</span>
    <button class="tool-btn tool-btn-labeled" data-bgcolor="transparent" title="No Background">None</button>
    <button class="tool-btn tool-btn-labeled" data-bgcolor="#fff4ce" style="background: #fff4ce;" title="Yellow Highlight">Yellow</button>
    <button class="tool-btn tool-btn-labeled" data-bgcolor="#c7e0f4" style="background: #c7e0f4;" title="Blue Highlight">Blue</button>
    <button class="tool-btn tool-btn-labeled" data-bgcolor="#dff6dd" style="background: #dff6dd;" title="Green Highlight">Green</button>
    <button class="tool-btn tool-btn-labeled" data-bgcolor="#fde7e9" style="background: #fde7e9;" title="Pink Highlight">Pink</button>
  </div>

  <!-- 5. Edit Panel -->
  <div id="tab-edit" class="ribbon-panel">
    <button class="tool-btn tool-btn-labeled" data-action="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="tool-btn tool-btn-labeled" data-action="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
    
    <div class="tool-divider"></div>

    <button class="tool-btn tool-btn-labeled" data-action="cutToClipboard" title="Cut (Ctrl+X)">✂ Cut</button>
    <button class="tool-btn tool-btn-labeled" data-action="copyToClipboard" title="Copy (Ctrl+C)">⎘ Copy</button>
    <button class="tool-btn tool-btn-labeled" data-action="pasteFromClipboard" title="Paste (Ctrl+V)">📋 Paste</button>

    <div class="tool-divider"></div>

    <button class="tool-btn tool-btn-labeled" data-action="selectAll" title="Select All (Ctrl+A)">Select All</button>
  </div>

  <!-- Main MathLive Canvas -->
  <main>
    <div class="editor-label">
      <span>Visual Math Canvas</span>
      <span style="font-weight: normal; text-transform: none;">Click or tap to edit visually</span>
    </div>

    <!-- Notice banner for errors -->
    <div id="dialogNotice" class="dialog-notice"></div>

    <!-- MathLive Web Component -->
    <math-field id="mathField" smart-mode="true" virtual-keyboard-mode="manual"></math-field>

    <!-- Synchronized LaTeX view -->
    <div class="latex-preview-card">
      <div class="editor-label">
        <span>LaTeX Representation</span>
      </div>
      <div id="latexOutput" class="latex-code"></div>
    </div>
  </main>

  <!-- Dialog Footer -->
  <footer>
    <button id="btnCancel" class="btn btn-secondary">Cancel</button>
    <button id="btnInsert" class="btn btn-primary">
      <span id="btnInsertText">Insert into Document</span>
    </button>
  </footer>

  <script>
    // Universal Office initialization shim
    window.Office = window.Office || {};
    Office.initialize = function () {
      console.log('Office.initialize in dialog triggered');
    };

    const mathField = document.getElementById('mathField');
    const latexOutput = document.getElementById('latexOutput');
    const btnInsert = document.getElementById('btnInsert');
    const btnInsertText = document.getElementById('btnInsertText');
    const btnCancel = document.getElementById('btnCancel');
    const btnClear = document.getElementById('btnClear');
    const btnToggleKeyboard = document.getElementById('btnToggleKeyboard');
    const editorModeTag = document.getElementById('editorModeTag');
    const dialogNotice = document.getElementById('dialogNotice');

    function showNotice(msg) {
      if (!dialogNotice) return;
      dialogNotice.textContent = msg;
      dialogNotice.style.display = 'block';
      setTimeout(() => {
        dialogNotice.style.display = 'none';
      }, 5000);
    }

    /**
     * Update synchronized LaTeX string display
     */
    function updateLatexDisplay() {
      const latex = mathField.value;
      latexOutput.textContent = latex || '(empty equation)';
    }

    /**
     * Resilient Multi-Channel Messenger to Parent Window
     */
    function sendToParent(action, latex = '') {
      const payloadString = JSON.stringify({
        action: action,
        latex: latex,
        timestamp: Date.now()
      });

      console.log('sendToParent invoked with:', action);

      let dispatched = false;

      // 1. Primary: Office Dialog API messageParent
      try {
        if (typeof Office !== 'undefined' && Office.context && Office.context.ui && typeof Office.context.ui.messageParent === 'function') {
          Office.context.ui.messageParent(payloadString);
          console.log('Dispatched via Office.context.ui.messageParent');
          dispatched = true;
        }
      } catch (err) {
        console.warn('Office.context.ui.messageParent failed:', err);
      }

      // 2. Secondary: postMessage to opener or parent window
      try {
        if (window.opener && typeof window.opener.postMessage === 'function') {
          window.opener.postMessage(payloadString, '*');
          console.log('Dispatched via window.opener.postMessage');
          dispatched = true;
        }
        if (window.parent && window.parent !== window && typeof window.parent.postMessage === 'function') {
          window.parent.postMessage(payloadString, '*');
          console.log('Dispatched via window.parent.postMessage');
          dispatched = true;
        }
      } catch (err) {
        console.warn('postMessage failed:', err);
      }

      // 3. Tertiary: BroadcastChannel
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          const channel = new BroadcastChannel('mathtype_bridge_channel');
          channel.postMessage(payloadString);
          channel.close();
          console.log('Dispatched via BroadcastChannel');
          dispatched = true;
        }
      } catch (err) {
        console.warn('BroadcastChannel failed:', err);
      }

      // 4. Quaternary: LocalStorage Event Bus
      try {
        localStorage.setItem('mathtype_dialog_bridge', payloadString);
        console.log('Dispatched via localStorage bridge');
        dispatched = true;
      } catch (err) {
        console.warn('localStorage bridge failed:', err);
      }

      // If user clicked cancel, attempt closing window as local fallback
      if (action === 'cancel') {
        setTimeout(() => {
          try {
            window.close();
          } catch (_) {}
        }, 150);
      }

      return dispatched;
    }

    /**
     * Ensure all newly created empty cells in any matrix environment have visible placeholder boxes
     */
    function fillEmptyMatrixCells(tex) {
      if (!tex) return tex;
      return tex.replace(/(\\begin\{(?:[a-zA-Z]*matrix|matrix|array)\})([\s\S]*?)(\\end\{(?:[a-zA-Z]*matrix|matrix|array)\})/g, (match, openTag, body, closeTag) => {
        const rows = body.split('\\\\');
        const newRows = rows.map(row => {
          const cells = row.split('&');
          const newCells = cells.map(cell => {
            if (cell.trim() === '') {
              return '\\placeholder{}';
            }
            return cell;
          });
          return newCells.join(' & ');
        });
        return openTag + newRows.join(' \\\\ ') + closeTag;
      });
    }

    /**
     * Add or remove rows/columns in matrices and ensure placeholder boxes appear
     */
    function handleMatrixModification(action) {
      mathField.executeCommand(action);

      if (action === 'addColumnAfter' || action === 'addColumnBefore' || action === 'addRowAfter' || action === 'addRowBefore') {
        const currentTex = mathField.getValue();
        const filledTex = fillEmptyMatrixCells(currentTex);
        if (filledTex !== currentTex) {
          mathField.setValue(filledTex, { selectionMode: 'item' });
        }
      }

      mathField.focus();
      updateLatexDisplay();
    }

    /**
     * Ribbon Tabs navigation
     */
    document.querySelectorAll('.tab-btn').forEach(tabBtn => {
      tabBtn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.ribbon-panel').forEach(p => p.classList.remove('active'));

        tabBtn.classList.add('active');
        const targetId = tabBtn.dataset.tab;
        const panel = document.getElementById(targetId);
        if (panel) panel.classList.add('active');
      });
    });

    /**
     * Command Buttons (Insert commands)
     */
    document.querySelectorAll('.tool-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cmd = btn.dataset.cmd;
        const arg = btn.dataset.arg;
        if (cmd && arg) {
          mathField.executeCommand([cmd, arg]);
          mathField.focus();
          updateLatexDisplay();
        }
      });
    });

    /**
     * Matrix Action Buttons (+ Col, + Row, - Col, - Row)
     */
    document.querySelectorAll('.tool-btn[data-matrix-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.matrixAction;
        if (action) {
          handleMatrixModification(action);
        }
      });
    });

    /**
     * General Action Buttons (Edit operations: cut, copy, paste, undo, redo, selectAll)
     */
    document.querySelectorAll('.tool-btn[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if (action) {
          mathField.executeCommand(action);
          mathField.focus();
          updateLatexDisplay();
        }
      });
    });

    /**
     * Text Color Swatches
     */
    document.querySelectorAll('.color-swatch[data-color]').forEach(swatch => {
      swatch.addEventListener('click', () => {
        const color = swatch.dataset.color;
        mathField.executeCommand(['applyStyle', { color: color }]);
        mathField.focus();
        updateLatexDisplay();
      });
    });

    /**
     * Background Color Swatches
     */
    document.querySelectorAll('[data-bgcolor]').forEach(btn => {
      btn.addEventListener('click', () => {
        const bgColor = btn.dataset.bgcolor;
        mathField.executeCommand(['applyStyle', { backgroundColor: bgColor }]);
        mathField.focus();
        updateLatexDisplay();
      });
    });

    /**
     * Virtual Keyboard Toggle Button (In Tabs bar)
     */
    btnToggleKeyboard.addEventListener('click', () => {
      mathField.executeCommand(['toggleVirtualKeyboard']);
      mathField.focus();
    });

    /**
     * Clear Button (In Header)
     */
    btnClear.addEventListener('click', () => {
      mathField.value = '';
      updateLatexDisplay();
      mathField.focus();
    });

    /**
     * Initialize on Office.onReady
     */
    Office.onReady((info) => {
      console.log('Office.onReady resolved in editor dialog. Host:', info ? info.host : 'unknown');

      // Hide default corner menu
      try {
        mathField.menuItems = [];
      } catch (_) {}

      // Parse LaTeX passed from Task Pane through URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const initialLatex = urlParams.get('latex');

      if (initialLatex) {
        const decoded = decodeURIComponent(initialLatex);
        mathField.value = decoded;
        editorModeTag.textContent = 'Edit Mode';
        btnInsertText.textContent = 'Update Equation';
      } else {
        mathField.value = '';
        editorModeTag.textContent = 'New Equation';
        btnInsertText.textContent = 'Insert into Document';
      }

      updateLatexDisplay();

      // Focus editor
      setTimeout(() => {
        mathField.focus();
      }, 200);
    });

    // Event listener for MathLive input changes
    mathField.addEventListener('input', updateLatexDisplay);

    // Insert button click
    btnInsert.addEventListener('click', () => {
      const latex = mathField.value.trim();
      if (!latex) {
        showNotice('The equation is empty. Please enter an equation or click Cancel.');
        return;
      }

      btnInsert.disabled = true;
      btnInsertText.textContent = 'Inserting...';
      sendToParent('insert', latex);
    });

    // Cancel button click
    btnCancel.addEventListener('click', () => {
      btnCancel.disabled = true;
      sendToParent('cancel');
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        const latex = mathField.value.trim();
        if (latex) {
          sendToParent('insert', latex);
        }
      } else if (e.key === 'Escape') {
        sendToParent('cancel');
      }
    });
  </script>
</body>
</html>
